services:
  - type: web
    name: wa-crm-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_ACCESS_TOKEN
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Main site only: the clients' own copies, comma separated (https://wof.teaminboxpro.com). Their people can then sign in on the main site and app.
      - key: CLIENT_SITES
        sync: false
      # AI Agent: the key of your Anthropic (Claude) account. Without it the AI Agent page says it is not connected.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WA_DRY_RUN
        value: "false"
