<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team inbox</title>
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#18262b;--mute:#66767b;--line:#dde3e1;--pine:#0e5a4a;--pine2:#0a4338;--mint:#d9efe6;--lav:#ebe8f7;--amber:#9a4a07;--amberbg:#fdf1de;--red:#b3261e;--blue:#1d6fb8}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.mute{color:var(--mute)}.err{color:var(--red);min-height:1.4em}
.btn{background:var(--pine);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}.btn:hover{background:var(--pine2)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px}.ghost:hover{background:var(--bg)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login form{background:var(--panel);padding:30px;border-radius:14px;width:min(380px,100%);display:grid;gap:12px;border:1px solid var(--line)}
.login h1{margin:0;font-size:24px}.login p{margin:0 0 6px}
.shell{display:grid;grid-template-columns:350px 1fr;height:100vh;height:100dvh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.top .nav{display:flex;gap:6px}.top .me{line-height:1.2}.top .me small{display:block;color:var(--mute)}
.tools{padding:0 14px 10px;display:grid;gap:8px}
.tabs{display:flex;gap:4px}.tabs button{flex:1;border:0;background:var(--bg);padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--pine);color:#fff}
.list{overflow:auto;flex:1;border-top:1px solid var(--line)}
.row{display:flex;gap:11px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px}
.row:hover{background:var(--bg)}.row.on{background:var(--mint)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pine);color:#fff;display:grid;place-items:center;font-weight:700}
.rb{flex:1;min-width:0;display:grid;gap:2px}
.r1,.r2{display:flex;justify-content:space-between;gap:8px}.r1 time{font-size:12px;color:var(--mute)}
.prev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:13px}
.ub{background:var(--pine);color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.r3{display:flex;gap:5px;flex-wrap:wrap}
.tag,.chip{font-style:normal;font-size:12px;border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--mute)}
.chip.ok{background:var(--mint);color:var(--pine2)}.chip.warn{background:var(--amberbg);color:var(--amber)}.chip.closed{background:#f6dcda;color:var(--red)}
.empty{padding:30px 20px;color:var(--mute);text-align:center}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.chat,.team{display:flex;flex-direction:column;flex:1;min-height:0}
.chat.empty{align-items:center;justify-content:center;color:var(--mute)}
.ch{display:flex;align-items:center;gap:10px;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.who{flex:1;min-width:0;display:grid;line-height:1.25}.back{display:none;border:0;background:none;font-size:26px;line-height:1;padding:0 6px}
.mgr{display:flex;align-items:center;gap:8px;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;font-size:13px}.mgr select{max-width:280px;padding:6px 8px}
.notes{background:#fffbea;border-bottom:1px solid var(--line);padding:10px 14px;max-height:34%;overflow:auto;font-size:14px}
.notes p{margin:0 0 6px}.notes small{color:var(--mute)}.notes form{display:flex;gap:8px;margin-top:8px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);border-radius:10px;padding:2px 10px;margin:8px 0}
.b{max-width:min(560px,82%);padding:7px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.b p{margin:0;white-space:pre-wrap;word-break:break-word}
.b.out{align-self:flex-end;background:var(--mint);border-color:#bfe0d1}.b.bot{background:var(--lav);border-color:#d6d0ee}
.meta{display:flex;justify-content:flex-end;gap:5px;font-size:11px;color:var(--mute)}
.tg{font-size:11px;font-weight:700;color:var(--mute)}.tk.read{color:var(--blue)}.tk.failed{color:var(--red);font-weight:700}.er{font-size:12px;color:var(--red)}
.cmp,.tpl{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
.cmp textarea{resize:none;max-height:140px}
.bar{padding:10px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:14px;color:var(--mute)}.bar.warn{background:var(--amberbg);color:var(--amber)}
.team{overflow:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:14px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--mute);font-size:13px}.stats b{display:block;font-size:26px;color:var(--ink)}
.tbl{margin:0 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:520px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}th{font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c3cbc9;margin-right:6px}.dot.on{background:#2f9e6e}
.add{margin:0 14px 24px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.add h3{grid-column:1/-1;margin:0}
.mi{max-width:260px;max-height:260px;border-radius:8px;display:block;cursor:zoom-in;background:var(--bg);margin-bottom:4px}
.b audio{width:240px;max-width:100%;display:block;margin-bottom:4px}.b video{max-width:100%;border-radius:8px}.b .ghost{margin-bottom:4px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.86);display:grid;place-items:center;z-index:20;cursor:zoom-out}.lb img{max-width:94vw;max-height:90vh}
.cmp .ghost{padding:9px 11px}
.panel{margin:0 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.panel h3{margin:0 0 10px;font-size:15px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px}.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col i{width:100%;background:var(--pine);border-radius:4px 4px 0 0;min-height:2px}.col small{font-size:10px;color:var(--mute);margin-top:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.hb{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hb i{display:block;height:10px;background:var(--pine);border-radius:5px;min-width:3px}.hb b{text-align:right}
.qr{max-height:200px;overflow:auto;background:var(--panel);border-top:1px solid var(--line)}
.qr button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;border-bottom:1px solid var(--line)}.qr button:hover{background:var(--bg)}
.qr small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{display:flex;gap:6px;flex-wrap:wrap;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.lb2{border:1px solid;border-radius:12px;padding:1px 11px;font-size:12px;background:none}
.fld{display:grid;gap:4px;margin-bottom:10px}.fld>span{font-size:13px;color:var(--mute)}.panel textarea{resize:vertical}
.nav2{display:flex;gap:4px;flex-wrap:wrap;padding:0 14px 8px}.nav2 .ghost{padding:4px 9px;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:9;max-width:90vw}
@media(max-width:760px){.shell{grid-template-columns:1fr}.main{display:none}.chat-open .main{display:flex}.chat-open .side{display:none}.back{display:block}}
</style></head><body>
<div id="app"></div>
<script>
const API = window.API_BASE || '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = { token:null, user:null, convs:[], active:null, conv:null, msgs:[], notes:[], tab:'open', agent:'', templates:[], agents:[], winOpen:null };
const arr = x => Array.isArray(x) ? x : [];
const isMgr = () => S.user && S.user.role !== 'agent';

async function api(path, method = 'GET', body) {
  const r = await fetch(API + '/api' + path, { method, headers: { 'Content-Type':'application/json', Authorization:'Bearer ' + S.token }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { logout(); return { error:'Session expired' }; }
  const d = await r.json().catch(() => ({}));
  return r.ok ? d : { error: d.error || 'Request failed', code: d.code };
}
function toast(t) { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 4000); }
const fmtT = t => new Date(t).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
const fmtD = t => { const d = new Date(t); return d.toDateString() === new Date().toDateString() ? fmtT(t) : d.toLocaleDateString([], { day:'numeric', month:'short' }); };
function win(c) {
  const ms = c.window_expires_at ? new Date(c.window_expires_at) - Date.now() : 0;
  if (ms <= 0) return { open:false, txt:'Window closed', cls:'closed' };
  return { open:true, txt:`${Math.floor(ms / 36e5)}h ${Math.floor(ms % 36e5 / 6e4)}m left`, cls: ms < 72e5 ? 'warn' : 'ok' };
}

/* ---------- Login ---------- */
function showLogin(err) {
  $('#app').innerHTML = `<div class="login"><form id="lf"><h1>Team inbox</h1><p class="mute">Sign in with the account your manager created for you.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
  <button class="btn">Sign in</button><div class="err">${esc(err || '')}</div></form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch(API + '/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email:$('#em').value, password:$('#pw').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return showLogin(d.error || 'Could not sign in');
    S.token = d.token; S.user = d.user; localStorage.setItem('wa_auth', JSON.stringify({ token:d.token, user:d.user })); boot();
  };
}
function logout() { if (S.pushToken && S.token) fetch(API + '/api/devices/remove', { method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + S.token}, body: JSON.stringify({ token: S.pushToken }) }).catch(() => {}); localStorage.removeItem('wa_auth'); if (S.sock) S.sock.disconnect(); S.token = null; showLogin(); }

/* ---------- Shell + list ---------- */
async function boot() {
  const tabs = isMgr() ? [['open','Open'],['unassigned','Unassigned'],['held','Held'],['closed','Closed']] : [['open','Open'],['closed','Closed']];
  $('#app').innerHTML = `<div class="shell"><aside class="side">
    <header class="top"><div class="me"><b>${esc(S.user.name)}</b><small>${esc(S.user.role)}${S.user.team && !isMgr() ? ' · ' + esc(S.user.team) : ''}</small></div>
    <div class="nav"><button class="ghost" id="pwb">Password</button><button class="ghost" id="out">Sign out</button></div></header>${isMgr() ? '<div class="nav2"><button class="ghost" id="nd">Dashboard</button><button class="ghost" id="nb">Broadcasts</button><button class="ghost" id="nc">Contacts</button><button class="ghost" id="nm">Templates</button><button class="ghost" id="na">Follow-ups</button><button class="ghost" id="ns">Settings</button><button class="ghost" id="nt">Team</button></div>' : ''}
    <div class="tools"><input id="q" placeholder="Search name or number"><div class="tabs" id="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${k === S.tab ? 'on' : ''}">${l}</button>`).join('')}</div>
    ${isMgr() ? '<select id="as"><option value="">All agents</option></select>' : ''}<select id="lf"><option value="">All labels</option></select></div><div id="list" class="list"></div></aside>
    <main class="main"><div id="chat" class="chat empty">Select a chat to start</div><div id="team" class="team" hidden></div></main></div>`;
  $('#out').onclick = logout;
  $('#pwb').onclick = async () => { const cur = prompt('Your current password'); if (cur === null) return; const nw = prompt('New password (at least 8 characters)'); if (!nw) return; const r = await api('/me/password', 'POST', { current: cur, password: nw }); toast(r.error || 'Password changed'); };
  $('#q').oninput = debounce(loadList, 300);
  $('#lf').onchange = e => { S.label = e.target.value; loadList(); };
  $('#tabs').onclick = e => { const t = e.target.dataset.t; if (!t) return; S.tab = t; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); loadList(); };
  if (isMgr()) { $('#nd').onclick = () => showDashboard(); $('#ns').onclick = showSettings; $('#nb').onclick = showBroadcasts; $('#nc').onclick = showContacts; $('#nm').onclick = showTemplates; $('#na').onclick = showFollowups; $('#nt').onclick = showTeam; $('#as').onchange = e => { S.agent = e.target.value; loadList(); }; loadAgents(); }
  S.templates = arr(await api('/templates')); S.labels = arr(await api('/labels')); S.quick = arr(await api('/quick-replies')); fillLabelFilter();
  await loadList(); connect(); initPush();
  document.addEventListener('click', () => window.Notification && Notification.permission === 'default' && Notification.requestPermission(), { once:true });
  setInterval(tick, 30000);
}
function debounce(f, ms) { let t; return () => { clearTimeout(t); t = setTimeout(f, ms); }; }
async function loadAgents() {
  const us = await api('/users'); if (us.error) return;
  S.agents = us.filter(u => u.role === 'agent' && u.is_active);
  $('#as').innerHTML = '<option value="">All agents</option>' + S.agents.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('');
}
async function loadList() {
  const p = new URLSearchParams();
  if (S.tab === 'unassigned') p.set('unassigned', 'true'); else if (S.tab === 'held') p.set('held', 'true'); else { p.set('status', S.tab); if (S.agent) p.set('assigned_to', S.agent); }
  const q = $('#q').value.trim(); if (q) p.set('q', q);
  if (S.label) p.set('label', S.label);
  const d = await api('/conversations?' + p); if (d.error) return;
  S.convs = d; renderList();
}
function renderList() {
  const el = $('#list');
  const unread = S.convs.reduce((n, c) => n + c.unread_count, 0);
  document.title = (unread ? `(${unread}) ` : '') + 'Team inbox';
  if (!S.convs.length) { el.innerHTML = `<p class="empty">${S.tab === 'open' ? 'No open chats yet. New clients appear here as soon as the bot hands them over.' : 'Nothing here.'}</p>`; return; }
  el.innerHTML = S.convs.map(c => { const w = win(c); const nm = c.contact_name || '+' + c.wa_id;
    return `<button class="row${c.id === S.active ? ' on' : ''}" data-id="${c.id}"><span class="av">${esc(((c.contact_name || '#').trim()[0] || '#').toUpperCase())}</span><span class="rb">
    <span class="r1"><b>${esc(nm)}</b><time>${fmtD(c.last_message_at)}</time></span>
    <span class="r2"><span class="prev">${esc(c.last_body || '')}</span>${c.unread_count ? `<i class="ub">${c.unread_count}</i>` : ''}</span>
    <span class="r3"><em class="tag">${esc(c.intent || 'new')}</em><em class="chip ${w.cls}">${w.txt}</em>${(c.labels || []).map(l => `<em class="tag" style="background:${esc(l.color)}22;color:${esc(l.color)}">${esc(l.name)}</em>`).join('')}${isMgr() ? `<em class="tag">${esc(c.agent_name || 'unassigned')}</em>` : ''}</span></span></button>`; }).join('');
  el.querySelectorAll('.row').forEach(b => b.onclick = () => openConv(+b.dataset.id));
}

/* ---------- Chat ---------- */
async function openConv(id) {
  S.active = id; document.body.classList.add('chat-open'); $('#team').hidden = true; $('#chat').hidden = false;
  const d = await api(`/conversations/${id}/messages`); if (d.error) return toast(d.error);
  if (S.active !== id) return;
  S.conv = d.conversation; S.msgs = d.messages; S.notes = d.notes; S.more = d.messages.length >= 50;
  $('#chat').className = 'chat';
  $('#chat').innerHTML = '<div id="head"></div><div id="lbl"></div><div id="mgr"></div><section id="notes" class="notes" hidden></section><div id="msgs" class="msgs"></div><div id="comp"></div>';
  renderHead(); renderLabels(); renderMgr(); renderNotes(); renderMsgs(); renderComposer();
  api(`/conversations/${id}/read`, 'POST').then(loadList);
}
function renderHead() {
  const c = S.conv, w = win(c);
  $('#head').innerHTML = `<header class="ch"><button class="back" id="back" aria-label="Back">‹</button><div class="who"><b>${esc(c.contact_name || 'Unnamed')}</b><span class="mute">+${esc(c.wa_id)} · ${esc(c.intent || 'new')}</span></div>
  <span class="chip ${w.cls}">${w.txt}</span><button class="ghost" id="notesbtn">Notes (${S.notes.length})</button>${c.bot_step === 'held' ? '' : `<button class="ghost" id="st">${c.status === 'closed' ? 'Reopen' : 'Close chat'}</button>`}${c.bot_step === 'held' && isMgr() ? '<button class="ghost" id="relbtn">Start as client</button>' : ''}<button class="ghost" id="nonclient">Not a client</button></header>`;
  $('#back').onclick = () => { document.body.classList.remove('chat-open'); S.active = null; renderList(); };
  $('#notesbtn').onclick = () => { const n = $('#notes'); n.hidden = !n.hidden; };
  $('#nonclient').onclick = async () => { if (!confirm('Mark this person as not a client? Their chat is deleted and they are ignored from now on.')) return; const r = await api(`/conversations/${S.active}/not-client`, 'POST'); if (r.error) return toast(r.error); toast('Marked as not a client'); leaveChat(); };
  if ($('#relbtn')) $('#relbtn').onclick = async () => { const r = await api(`/conversations/${S.active}/release`, 'POST'); if (r.error) return toast(r.error); toast('The bot has greeted them'); leaveChat(); };
  if ($('#st')) $('#st').onclick = async () => { const r = await api(`/conversations/${S.active}/status`, 'POST', { status: c.status === 'closed' ? 'open' : 'closed' }); if (r.error) return toast(r.error); S.conv.status = c.status === 'closed' ? 'open' : 'closed'; renderHead(); renderComposer(); loadList(); };
}
function typingPing() {
  const t = $('#txt'); S.typingAt = S.typingAt || {};
  if (!t || !t.value.trim() || !S.conv || S.conv.assigned_to !== S.user.id || Date.now() - (S.typingAt[S.active] || 0) < 12000) return;
  S.typingAt[S.active] = Date.now(); api(`/conversations/${S.active}/typing`, 'POST');
}
function leaveChat() { S.active = null; S.conv = null; document.body.classList.remove('chat-open'); $('#chat').className = 'chat empty'; $('#chat').textContent = 'Select a chat to start'; loadList(); }
function renderMgr() {
  const el = $('#mgr'); if (!isMgr()) return;
  const c = S.conv;
  el.innerHTML = `<div class="mgr"><span>Assigned to</span><select id="rs"><option value="">Auto-pick</option>${S.agents.map(a => `<option value="${a.id}"${a.id === c.assigned_to ? ' selected' : ''}>${esc(a.name)} (${esc(a.team)}, ${a.active_chats} open)</option>`).join('')}</select><button class="ghost" id="rb">Reassign</button></div>`;
  $('#rb').onclick = async () => { const r = await api(`/conversations/${S.active}/reassign`, 'POST', { agent_id: $('#rs').value || undefined }); if (r.error) return toast(r.error); toast('Chat reassigned'); loadList(); loadAgents(); };
}
function renderNotes() {
  $('#notes').innerHTML = (S.notes.map(n => `<p><b>${esc(n.author)}</b> <small>${fmtD(n.created_at)}</small><br>${esc(n.body)}</p>`).join('') || '<p class="mute">No notes yet. Notes are internal and never sent to the client.</p>') +
    '<form id="nf"><input id="ni" placeholder="Add an internal note" required><button class="btn">Save note</button></form>';
  $('#nf').onsubmit = async e => { e.preventDefault(); const r = await api(`/conversations/${S.active}/notes`, 'POST', { body: $('#ni').value }); if (r.error) return toast(r.error);
    S.notes.push({ ...r, author: S.user.name }); renderNotes(); renderHead(); $('#notes').hidden = false; };
}
function renderMsgs(stick = true) {
  const el = $('#msgs'); let last = '';
  el.innerHTML = (S.more ? '<button class="ghost" id="older" style="align-self:center">Load earlier messages</button>' : '') + S.msgs.map(m => {
    const day = new Date(m.created_at).toDateString();
    const sep = day !== last ? `<div class="day">${new Date(m.created_at).toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' })}</div>` : ''; last = day;
    const cls = m.sender_type === 'customer' ? 'in' : m.sender_type === 'bot' ? 'out bot' : 'out';
    const tick = m.direction === 'out' ? `<span class="tk ${m.status}">${m.status === 'failed' ? 'Failed' : m.status === 'sent' ? '✓' : '✓✓'}</span>` : '';
    const tag = m.sender_type === 'bot' ? '<span class="tg">Bot</span>' : m.type === 'template' ? '<span class="tg">Template</span>' : '';

/* ---------- Media ---------- */
const blobs = {};
async function mediaBlob(id) {
  if (blobs[id]) return blobs[id];
  const r = await fetch(API + '/api/messages/' + id + '/media', { headers: { Authorization: 'Bearer ' + S.token } });
  if (!r.ok) throw new Error('unavailable');
  return blobs[id] = URL.createObjectURL(await r.blob());
}
function mediaHtml(m) {
  if (!m.media_id) return '';
  if (m.type === 'image' || m.type === 'sticker') return `<img class="mi" data-mid="${m.id}" alt="${esc(m.media_name || 'Photo')}">`;
  if (m.type === 'audio') return `<audio controls data-mid="${m.id}"></audio>`;
  if (m.type === 'video') return `<button class="ghost" data-open="${m.id}" data-play="1">Play video</button>`;
  return `<button class="ghost" data-open="${m.id}">Open ${esc(m.media_name || 'document')}</button>`;
}
function hydrateMedia(el, stick) {
  el.querySelectorAll('[data-mid]').forEach(n => mediaBlob(n.dataset.mid).then(u => {
    if (n.tagName === 'IMG') { n.onload = () => { if (stick) el.scrollTop = el.scrollHeight; }; n.onclick = () => lightbox(u); }
    n.src = u;
  }).catch(() => { const e = document.createElement('span'); e.className = 'er'; e.textContent = 'This file is no longer available'; n.replaceWith(e); }));
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openMedia(b));
}
function lightbox(u) { const d = document.createElement('div'); d.className = 'lb'; d.innerHTML = `<img src="${u}" alt="">`; d.onclick = () => d.remove(); document.body.appendChild(d); }
async function openMedia(b) {
  const m = S.msgs.find(x => x.id == b.dataset.open);
  try {
    const u = await mediaBlob(b.dataset.open);
    if (b.dataset.play) { const v = document.createElement('video'); v.controls = true; v.autoplay = true; v.src = u; b.replaceWith(v); return; }
    saveDoc(u, (m && m.media_name) || 'file');
  } catch { toast('This file is no longer available'); }
}
async function saveDoc(u, name) {
  const C = window.Capacitor;
  if (C && C.isNativePlatform && C.isNativePlatform()) {
    try {
      const blob = await (await fetch(u)).blob();
      const b64 = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(blob); });
      const w = await C.Plugins.Filesystem.writeFile({ path: name, data: b64, directory: 'CACHE' });
      await C.Plugins.Share.share({ title: name, url: w.uri });
    } catch { toast('Could not open the file'); }
    return;
  }
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
async function sendFile(file) {
  const id = S.active, cap = ($('#txt') && $('#txt').value.trim()) || '';
  if (file.size > 16 * 1024 * 1024) return toast('Files must be under 16 MB');
  if (/^image\/(jpeg|png)$/.test(file.type) && file.size > 5 * 1024 * 1024) return toast('Photos must be under 5 MB');
  toast('Sending ' + file.name + '…');
  const q = new URLSearchParams({ filename: file.name, mime: file.type || 'application/octet-stream', caption: cap });
  const r = await fetch(API + `/api/conversations/${id}/media?` + q, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream', Authorization: 'Bearer ' + S.token }, body: file });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || 'Could not send the file'); if (d.code === 'WINDOW_CLOSED' && S.conv) { S.conv.window_expires_at = null; renderHead(); renderComposer(); } return; }
  if (cap && $('#txt')) $('#txt').value = '';
  if (S.active === id) addMsg(d);
  loadList();
}

/* ---------- Phone app (Android) push ---------- */
async function initPush() {
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform() || !C.Plugins.PushNotifications) return;
  if (!/TeamInboxFCM/.test(navigator.userAgent)) return; // only builds that include Firebase; asking Android for a push token without it crashes the app
  const P = C.Plugins.PushNotifications;
  try {
    const perm = await P.requestPermissions(); if (perm.receive !== 'granted') return;
    await P.createChannel({ id: 'messages', name: 'Client messages', importance: 5, sound: 'default', vibration: true });
    P.addListener('registration', t => { S.pushToken = t.value; api('/devices', 'POST', { token: t.value }); });
    P.addListener('pushNotificationActionPerformed', a => { const id = a.notification && a.notification.data && a.notification.data.conversationId; if (id) openConv(+id); });
    await P.register();
  } catch (e) { console.log('push setup failed', e); }
}

/* ---------- Realtime ---------- */
function alertUser(title, body) {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); o.stop(a.currentTime + .12); } catch {}
  if (window.Notification && Notification.permission === 'granted' && document.hidden) new Notification(title, { body });
}
function connect() {
  const s = document.createElement('script'); s.src = API + '/socket.io/socket.io.js';
  s.onload = () => {
    const sock = S.sock = API ? window.io(API, { auth:{ token:S.token } }) : window.io({ auth:{ token:S.token } });
    sock.on('message:new', e => {
      const inbound = e.message.direction === 'in';
      if (e.conversationId === S.active) { inbound ? refreshActive() : addMsg(e.message); }
      else if (inbound && !isMgr()) alertUser('New message', e.message.body || '');
      loadList();
    });
    sock.on('message:status', e => { const m = S.msgs.find(x => x.wa_message_id === e.waMessageId); if (m && e.conversationId === S.active) { m.status = e.status; renderMsgs(false); } });
    sock.on('conversation:assigned', () => { if (!isMgr()) { alertUser('New client assigned', 'Open your inbox to reply.'); toast('A new client was assigned to you'); } loadList(); });
    sock.on('conversation:unassigned', () => { if (isMgr()) toast('A client is waiting and no agent is available'); loadList(); });
    sock.on('conversation:escalated', () => { if (isMgr()) toast('A client has been waiting for a reply too long'); loadList(); });
    sock.on('conversation:updated', loadList);
  };
  document.head.appendChild(s);
}

    if (r.error) return toast(r.error); toast(r.saved ? 'Found it and saved it' : 'None of these IDs contains your number'); $('#ws').innerHTML += '<br>' + r.results.map(x => `${esc(x.id)}: ${x.error ? esc(x.error) : x.has_ours ? 'this one has your number' : 'numbers: ' + esc(x.numbers.join(', ') || 'none')}`).join('<br>'); if (r.saved) loadWaStatus(); };
  $('#g1').value = g.mode;
  $('#gf').onsubmit = async e => { e.preventDefault(); const r = await api('/settings/gate', 'PUT', { mode: $('#g1').value, keywords: $('#g2').value }); toast(r.error || 'Saved'); };
  $('#qf').onsubmit = async e => { e.preventDefault(); const r = await api('/quick-replies', 'POST', { shortcut: $('#q1').value.trim().replace(/^\//, ''), title: $('#q2').value, body: $('#q3').value }); if (r.error) return toast(r.error.includes('duplicate') ? 'That shortcut already exists' : r.error); showSettings(); };
  $('#lf2').onsubmit = async e => { e.preventDefault(); const r = await api('/labels', 'POST', { name: $('#l1').value, color: $('#l2').value }); if (r.error) return toast(r.error.includes('duplicate') ? 'That label already exists' : r.error); showSettings(); };
  el.querySelectorAll('[data-dq]').forEach(x => x.onclick = async () => { await api('/quick-replies/' + x.dataset.dq, 'DELETE'); showSettings(); });
  el.querySelectorAll('[data-dl]').forEach(x => x.onclick = async () => { await api('/labels/' + x.dataset.dl, 'DELETE'); showSettings(); });
}

/* ---------- Broadcast tools (managers/admins) ---------- */
const field = (id, label, v = '', area) => `<label class="fld"><span>${label}</span>${area ? `<textarea id="${id}" rows="3">${esc(v)}</textarea>` : `<input id="${id}" value="${esc(v)}">`}</label>`;
function screen(title, extra = '') {
  document.body.classList.add('chat-open'); S.active = null; $('#chat').hidden = true; const el = $('#team'); el.hidden = false;
  el.innerHTML = `<header class="ch"><button class="back" id="tb">‹</button><b>${title}</b>${extra}</header><div id="sc"></div>`;
  $('#tb').onclick = () => { document.body.classList.remove('chat-open'); el.hidden = true; $('#chat').hidden = false; };
  return $('#sc');
}
async function showTemplates() {
  const sc = screen('Templates', '<span style="flex:1"></span><button class="ghost" id="ts">Refresh from Meta</button>');
  const list = S.templates = arr(await api('/templates'));
  const chip = st => `<em class="chip ${st === 'APPROVED' ? 'ok' : st === 'PENDING' ? 'warn' : st === 'local' ? '' : 'closed'}">${st === 'local' ? 'not on Meta' : esc(st.toLowerCase())}</em>`;
  sc.innerHTML = `<p class="mute" style="padding:12px 14px 0">Templates are the only messages WhatsApp lets you send after a client has been silent for 24 hours, and the only way to send broadcasts. Meta reviews each one, usually within minutes.</p>
  <div class="tbl" style="margin-top:12px"><table><tr><th>Name</th><th>Status</th><th>Type</th><th>Message</th><th></th></tr>
  ${list.map(t => `<tr><td>${esc(t.name)}<br><small class="mute">${esc(t.language)}</small></td><td>${chip(t.status)}${t.rejected_reason && t.rejected_reason !== 'NONE' ? `<br><small class="mute">${esc(t.rejected_reason)}</small>` : ''}</td><td>${esc(t.category)}</td><td style="max-width:340px">${esc(t.body)}</td><td>${t.status === 'local' ? `<button class="ghost" data-dt="${t.id}">Delete</button>` : ''}</td></tr>`).join('')}</table></div>
  <form class="panel" id="tf"><h3>New template</h3>${field('t1', 'Name (lowercase letters, numbers, underscores)', '')}
  <label class="fld"><span>Type</span><select id="t2"><option value="MARKETING">Marketing (offers, invitations)</option><option value="UTILITY">Utility (follow-ups, updates about their request)</option></select></label>
  ${field('t3', 'Language code', 'en')}${field('t4', 'Message text. Use {{1}}, {{2}} for things that change, e.g. Hi {{1}}, our class starts {{2}}.', '', 1)}
  ${field('t5', 'Example for each variable, separated by commas (Meta requires this), e.g. Ali, Friday 7pm', '')}${field('t6', 'Footer (optional)', '')}${field('t7', 'Quick reply buttons, up to 3, separated by commas (optional)', '')}
  <button class="btn">Submit to Meta</button></form>`;
  $('#ts').onclick = async () => { const r = await api('/templates/sync', 'POST'); if (r.error) return toast(r.error); toast(`Updated ${r.synced} templates`); showTemplates(); };
  $('#tf').onsubmit = async e => { e.preventDefault(); const sp = id => $(id).value.split(',').map(x => x.trim()).filter(Boolean);
    const r = await api('/templates', 'POST', { name: $('#t1').value.trim(), category: $('#t2').value, language: $('#t3').value.trim() || 'en', body: $('#t4').value, examples: sp('#t5'), footer: $('#t6').value.trim(), buttons: sp('#t7') });
    if (r.error) return toast(r.error); toast('Submitted. Use Refresh from Meta to see the decision.'); showTemplates(); };
  sc.querySelectorAll('[data-dt]').forEach(b => b.onclick = async () => { await api('/templates/' + b.dataset.dt, 'DELETE'); showTemplates(); });
}
async function showContacts() {
  const sc = screen('Contacts');
  const [d, lists] = await Promise.all([api('/contacts'), api('/contacts/lists')]); if (d.error) return toast(d.error);
  sc.innerHTML = `<div style="padding:12px 14px;display:flex;gap:8px"><input id="cq" placeholder="Search name or number"><select id="cl" style="width:auto"><option value="">All lists</option>${arr(lists).map(l => `<option value="${esc(l.list_name)}">${esc(l.list_name)} (${l.n})</option>`).join('')}</select></div>
  <p class="mute" style="padding:0 14px" id="cn"></p><div class="tbl"><table id="ct"></table></div>
  <form class="panel" id="imp"><h3>Import contacts</h3><p class="mute">Only import people who agreed to receive WhatsApp messages from you. They can reply STOP at any time and are removed from future broadcasts.</p>
  ${field('i1', 'List name, e.g. Webinar leads', '')}${field('i2', 'Country code for numbers that start with 0', '92')}
  <label class="fld"><span>Paste one person per line: name, phone</span><textarea id="i3" rows="6" placeholder="Ali Khan, 0300 1234567"></textarea></label>
  <label class="fld"><span>Or choose a CSV file</span><input type="file" id="i4" accept=".csv,.txt"></label>
  <label><input type="checkbox" id="i5" style="width:auto"> These people agreed to receive messages from us on WhatsApp</label><br><br><button class="btn">Import</button></form>
  <form class="panel" id="igf"><h3>Personal numbers to ignore</h3><p class="mute">Friends, family and anyone who is not a client. The system never replies to them, never stores their messages, and keeps them out of broadcasts.</p>
  <label class="fld"><span>One number per line</span><textarea id="ig1" rows="4" placeholder="0300 1234567"></textarea></label><button class="btn">Ignore these numbers</button></form>`;
  const draw = async () => {
    const r = await api('/contacts?' + new URLSearchParams({ q: $('#cq').value, list: $('#cl').value })); if (r.error) return;
    $('#cn').textContent = `Showing ${r.rows.length} of ${r.total} contacts`;
    $('#ct').innerHTML = '<tr><th>Name</th><th>Phone</th><th>List</th><th>Source</th><th>Status</th><th></th></tr>' + r.rows.map(c => `<tr><td>${esc(c.name || '—')}</td><td>+${esc(c.wa_id)}</td><td>${esc(c.list_name || '—')}</td><td>${esc(c.source || '—')}</td>
      <td>${c.is_personal ? '<em class="chip closed">ignored</em>' : c.opted_out ? '<em class="chip closed">opted out</em>' : `<em class="chip">${esc(c.chat_status === 'open' ? 'with ' + (c.agent || 'agent') : c.chat_status === 'bot' ? 'new' : c.chat_status || 'no chat')}</em>`}</td>
      <td><button class="ghost" data-oo="${c.id}" data-v="${c.opted_out}">${c.opted_out ? 'Opt in' : 'Opt out'}</button> <button class="ghost" data-ig="${c.id}" data-v="${c.is_personal}">${c.is_personal ? 'Stop ignoring' : 'Ignore'}</button></td></tr>`).join('');
    $('#ct').querySelectorAll('[data-oo]').forEach(b => b.onclick = async () => { await api('/contacts/' + b.dataset.oo, 'PATCH', { opted_out: b.dataset.v !== 'true' }); draw(); });
    $('#ct').querySelectorAll('[data-ig]').forEach(b => b.onclick = async () => { if (b.dataset.v !== 'true' && !confirm('Ignore this number? Their chat is deleted and the system will never reply to them.')) return; await api('/contacts/' + b.dataset.ig, 'PATCH', { is_personal: b.dataset.v !== 'true' }); draw(); });
  };
  $('#cq').oninput = debounce(draw, 300); $('#cl').onchange = draw; draw();
  $('#i4').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#i3').value = rd.result; }; rd.readAsText(f); };
  $('#igf').onsubmit = async e => { e.preventDefault(); const numbers = $('#ig1').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean); if (!numbers.length) return toast('Add at least one number');
    const r = await api('/contacts/ignore', 'POST', { numbers, country: $('#i2').value }); if (r.error) return toast(r.error); toast(`Ignoring ${r.ignored} numbers`); showContacts(); };
  $('#imp').onsubmit = async e => { e.preventDefault();
    const rows = $('#i3').value.split(/\r?\n/).map(l => { const parts = l.split(/[,;\t]/).map(x => x.trim()).filter(Boolean); const phone = parts.find(x => x.replace(/\D/g, '').length >= 7); return phone ? { phone, name: parts.find(x => x !== phone) || '' } : null; }).filter(Boolean);
    if (!rows.length) return toast('Add at least one phone number');
    const r = await api('/contacts/import', 'POST', { list_name: $('#i1').value, country: $('#i2').value, consent: $('#i5').checked, rows }); if (r.error) return toast(r.error);
    toast(`Added ${r.added}, updated ${r.updated}, skipped ${r.skipped} invalid`); showContacts(); };
}
async function showBroadcasts() {
  const sc = screen('Broadcasts', '<span style="flex:1"></span><button class="ghost" id="br">Refresh</button><button class="btn" id="bn">New broadcast</button>');
  S.templates = arr(await api('/templates')); const list = arr(await api('/broadcasts'));
  const chip = st => `<em class="chip ${st === 'done' ? 'ok' : st === 'cancelled' ? 'closed' : 'warn'}">${esc(st)}</em>`;
  sc.innerHTML = `<div class="tbl" style="margin-top:12px"><table><tr><th>Broadcast</th><th>Status</th><th>Results</th><th></th></tr>
  ${list.map(b => `<tr><td>${esc(b.name)}<br><small class="mute">${esc(b.template_name)} · ${b.status === 'scheduled' ? 'starts ' + new Date(b.scheduled_at).toLocaleString() : new Date(b.scheduled_at).toLocaleDateString()}</small></td><td>${chip(b.status)}</td>
  <td><small>Audience ${b.total} · Sent ${b.sent} · Delivered ${b.delivered} · Read ${b.read} · Replied ${b.replied} · Failed ${b.failed}${b.queued ? ' · Waiting ' + b.queued : ''}</small></td>
  <td>${b.status === 'scheduled' || b.status === 'sending' ? `<button class="ghost" data-cb="${b.id}">Cancel</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="mute">No broadcasts yet.</td></tr>'}</table></div><div id="bform"></div>`;
  $('#br').onclick = showBroadcasts; $('#bn').onclick = newBroadcast;
  sc.querySelectorAll('[data-cb]').forEach(b => b.onclick = async () => { if (!confirm('Stop this broadcast? Messages already sent stay sent.')) return; await api(`/broadcasts/${b.dataset.cb}/cancel`, 'POST'); showBroadcasts(); });
}
async function newBroadcast() {
  const box = $('#bform'), lists = arr(await api('/contacts/lists')), tpls = S.templates.filter(t => t.status === 'APPROVED');
  if (!tpls.length) { box.innerHTML = '<p class="panel mute">You need an approved template first. Create one under Templates.</p>'; return; }
  const chk = (cls, items) => items.map(i => `<label style="margin-right:12px;white-space:nowrap"><input type="checkbox" class="${cls}" value="${esc(i.v)}" style="width:auto"> ${esc(i.t)}</label>`).join('') || '<span class="mute">none yet</span>';
  box.innerHTML = `<form class="panel" id="nbf"><h3>New broadcast</h3>${field('n1', 'Name (only your team sees this)', '')}
  <label class="fld"><span>Template</span><select id="n2">${tpls.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select></label><p class="mute" id="n3"></p><div id="n4"></div>
  <div class="fld"><span>Audience. Leave everything unticked to message everyone who has not opted out.</span>
   <div><b>Lists</b> ${chk('sl', lists.map(l => ({ v: l.list_name, t: `${l.list_name} (${l.n})` })))}</div><div><b>Labels</b> ${chk('sb', S.labels.map(l => ({ v: l.id, t: l.name })))}</div>
   <div><b>Asked for</b> ${chk('si', [{ v: 'info', t: 'More info' }, { v: 'team', t: 'Join the team' }, { v: 'classes', t: 'Classes' }])}</div><div><b>Came from</b> ${chk('ss', [{ v: 'ad', t: 'Ads' }, { v: 'organic', t: 'Organic' }, { v: 'import', t: 'Imported' }])}</div></div>
  <p><button type="button" class="ghost" id="n5">Count audience</button> <span class="mute" id="n6"></span></p>
  <div class="fld"><span>When</span><div style="display:flex;gap:8px;align-items:center"><select id="n7" style="width:auto"><option value="now">Send now</option><option value="later">Schedule</option></select><input type="datetime-local" id="n8" hidden style="width:auto"></div></div>
  <p class="mute">WhatsApp limits how many new people a number can message each day (about 250 until your business is verified). Bigger audiences are sent over several days automatically.</p>
  <label><input type="checkbox" id="n9" style="width:auto"> Everyone in this audience agreed to receive these messages</label><br><br><button class="btn">Start broadcast</button></form>`;
  const seg = () => { const g = c => [...document.querySelectorAll('.' + c + ':checked')].map(x => x.value); return { lists: g('sl'), labels: g('sb').map(Number), intents: g('si'), sources: g('ss') }; };
  const vars = () => { const t = tpls.find(x => x.name === $('#n2').value); $('#n3').textContent = t.body;
    $('#n4').innerHTML = Array.from({ length: t.var_count }, (_, i) => `<div class="fld"><span>{{${i + 1}}} is</span><div style="display:flex;gap:8px"><select class="vt" style="width:auto"><option value="name">The client's first name</option><option value="text">Fixed text</option></select><input class="vv" placeholder="Text for everyone" hidden></div></div>`).join('');
    $('#n4').querySelectorAll('.vt').forEach(sel => sel.onchange = () => { sel.nextElementSibling.hidden = sel.value !== 'text'; }); };
  $('#n2').onchange = vars; vars(); $('#n7').onchange = e => { $('#n8').hidden = e.target.value !== 'later'; };
  $('#n5').onclick = async () => { const r = await api('/broadcasts/preview', 'POST', { segment: seg() }); $('#n6').textContent = r.error || `${r.count} people${r.count ? ', for example ' + r.sample.join(', ') : ''}`; };
  $('#nbf').onsubmit = async e => { e.preventDefault();
    const var_map = [...document.querySelectorAll('#n4 .fld')].map(f => ({ type: f.querySelector('.vt').value, value: f.querySelector('.vv').value }));
    const r = await api('/broadcasts', 'POST', { name: $('#n1').value, template_name: $('#n2').value, var_map, segment: seg(), consent: $('#n9').checked, scheduled_at: $('#n7').value === 'later' && $('#n8').value ? new Date($('#n8').value).toISOString() : null });
    if (r.error) return toast(r.error); toast(`Broadcast started for ${r.recipients} people`); showBroadcasts(); };
}

async function showFollowups() {
  const sc = screen('Follow-ups'); S.templates = arr(await api('/templates')); const list = arr(await api('/drips')), tpls = S.templates.filter(t => t.status === 'APPROVED');
  const unit = h => h >= 24 && h % 24 === 0 ? `${h / 24} day${h / 24 > 1 ? 's' : ''}` : `${h} hour${h === 1 ? '' : 's'}`;
  const row = i => `<div class="stp fld"><span>Step ${i + 1}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="number" class="sd" min="0" value="${i === 0 ? 24 : i === 1 ? 2 : 3}" style="width:80px"><select class="su" style="width:auto"><option value="1">hours</option><option value="24"${i ? ' selected' : ''}>days</option></select>
    <select class="st2" style="flex:1"><option value="">${i ? '(no step)' : 'Choose a template'}</option>${tpls.map(t => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}</select></div><input class="sv" placeholder="Text for {{2}}, {{3}} if the template has them, separated by commas" style="margin-top:6px"></div>`;
  sc.innerHTML = `<p class="mute" style="padding:12px 14px 0">Automatic messages sent after a client is handed to an agent. Each step is a template, sent after the delay you choose. If the client replies, the sequence stops, so nobody who is already talking to you gets nagged.</p>
  <div class="tbl" style="margin-top:12px"><table><tr><th>Follow-up</th><th>Steps</th><th>Clients</th><th></th></tr>${list.map(d => `<tr><td>${esc(d.name)}<br>${d.active ? '<em class="chip ok">on</em>' : '<em class="chip warn">paused</em>'}</td><td><small>${d.steps.map((s, i) => `${i + 1}. after ${unit(s.delay_hours)}: ${esc(s.template)}`).join('<br>')}</small></td>
  <td><small>In sequence ${d.running} · Finished ${d.done} · Stopped ${d.stopped}</small></td><td><button class="ghost" data-dp="${d.id}" data-a="${d.active}">${d.active ? 'Pause' : 'Resume'}</button> <button class="ghost" data-dd="${d.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="4" class="mute">No follow-ups yet.</td></tr>'}</table></div>
  ${tpls.length ? `<form class="panel" id="dpf"><h3>New follow-up</h3>${field('d1', 'Name', '')}<label><input type="checkbox" id="d2" checked style="width:auto"> Stop when the client replies</label><br><br>${row(0)}${row(1)}${row(2)}<button class="btn">Create follow-up</button></form>` : '<p class="panel mute">You need an approved template first. Create one under Templates.</p>'}`;
  sc.querySelectorAll('[data-dp]').forEach(b => b.onclick = async () => { await api('/drips/' + b.dataset.dp, 'PATCH', { active: b.dataset.a !== 'true' }); showFollowups(); });
  sc.querySelectorAll('[data-dd]').forEach(b => b.onclick = async () => { if (!confirm('Delete this follow-up?')) return; await api('/drips/' + b.dataset.dd, 'DELETE'); showFollowups(); });
  if ($('#dpf')) $('#dpf').onsubmit = async e => { e.preventDefault();
    const steps = [...document.querySelectorAll('.stp')].map(r => { const n = r.querySelector('.st2').value; if (!n) return null; const t = tpls.find(x => x.name === n); const extra = r.querySelector('.sv').value.split(',').map(x => x.trim());
      return { delay_hours: (+r.querySelector('.sd').value || 0) * +r.querySelector('.su').value, template: n, var_map: Array.from({ length: t.var_count }, (_, i) => i === 0 ? { type: 'name' } : { type: 'text', value: extra[i - 1] || '' }) }; }).filter(Boolean);
    const r = await api('/drips', 'POST', { name: $('#d1').value, stop_on_reply: $('#d2').checked, steps }); if (r.error) return toast(r.error); toast('Follow-up created'); showFollowups(); };
}

/* ---------- Dashboard (managers/admins) ---------- */
const fmtDur = s => s == null ? '—' : s < 60 ? Math.round(s) + 's' : s < 3600 ? Math.round(s / 60) + 'm' : Math.floor(s / 3600) + 'h ' + Math.round(s % 3600 / 60) + 'm';
async function showDashboard(days = 14) {
  document.body.classList.add('chat-open'); S.active = null; $('#chat').hidden = true; const el = $('#team'); el.hidden = false;
  const d = await api('/analytics?days=' + days); if (d.error) return toast(d.error);
  const k = d.kpi, max = Math.max(1, ...d.perDay.map(x => x.chats)), m = d.messages;
  const names = { info:'More info', team:'Join the team', classes:'Classes', unknown:'Not answered', ad:'From ads', organic:'Organic' };
  const hbars = list => { const top = Math.max(1, ...list.map(x => x.n)); return list.length ? list.map(x => `<div class="hb"><span>${esc(names[x.k] || x.k)}</span><i style="width:${x.n / top * 100}%"></i><b>${x.n}</b></div>`).join('') : '<p class="mute">No data yet</p>'; };
  const card = (v, l) => `<div><b>${v}</b>${l}</div>`;
  el.innerHTML = `<header class="ch"><button class="back" id="tb">‹</button><b>Dashboard</b><span style="flex:1"></span>
    <select id="dr" style="width:auto">${[7, 14, 30, 90].map(n => `<option value="${n}"${n === d.days ? ' selected' : ''}>Last ${n} days</option>`).join('')}</select></header>
  <div class="stats">${card(k.new_chats, 'new chats')}${card(k.open, 'open now')}${card(k.unassigned, 'waiting for an agent')}${card(k.with_bot, 'still with the bot')}
    ${card(fmtDur(d.median_reply_sec), 'median first reply')}${card(m.inbound, 'messages received')}${card(m.agent_out, 'sent by agents')}${card(m.bot_out, 'sent by the bot')}</div>
  <div class="panel"><h3>New chats per day</h3><div class="chart">${d.perDay.map(x => `<div class="col" title="${x.day}: ${x.chats}"><i style="height:${Math.round(x.chats / max * 120)}px"></i><small>${d.perDay.length > 31 ? '' : x.day.slice(8)}</small></div>`).join('')}</div></div>
  <div class="two"><div class="panel"><h3>What clients asked for</h3>${hbars(d.intents)}</div><div class="panel"><h3>Where clients came from</h3>${hbars(d.sources)}</div></div>
  <div class="tbl"><table><tr><th>Agent</th><th>Team</th><th>Chats received</th><th>Replied</th><th>Median first reply</th><th>Messages sent</th><th>Open now</th><th>Unread</th></tr>
  ${d.agents.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.team)}</td><td>${a.assigned}</td><td>${a.replied}/${a.assigned}</td><td>${fmtDur(a.median_reply_sec)}</td><td>${a.msgs_sent}</td><td>${a.open_now}</td><td>${a.unread}</td></tr>`).join('') || '<tr><td colspan="8" class="mute">No agents yet</td></tr>'}</table></div>`;
  $('#tb').onclick = () => { document.body.classList.remove('chat-open'); el.hidden = true; $('#chat').hidden = false; };
  $('#dr').onchange = e => showDashboard(+e.target.value);
}

try { const a = JSON.parse(localStorage.getItem('wa_auth')); if (a && a.token) { S.token = a.token; S.user = a.user; boot(); } else showLogin(); } catch { showLogin(); }
